<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복약 확인 체험판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@700&display=swap">
<style>
/* Layout: 홈페이지와 같은 크림·꿀색. 휴대폰은 한 줄, PC(900px 이상)는 왼쪽 약 등록 + 오른쪽 목록 */
:root{
  --bg:#fff8ec; --band:#f8edd9; --surface:#fffdf8; --fg:#2b2118; --muted:#5e5044; --line:#e6d6bb;
  --accent:#d99a2b; --accent-ink:#8a5a0b; --on-accent:#2b2118;
  --alert:#b8392a; --alert-soft:#fbe6e1; --plan:#7a6a57;
  --font-display:"Gowun Batang","Noto Serif KR",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --radius:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1913;--band:#251f18;--surface:#2a231b;--fg:#f5ebdd;--muted:#cbbba6;--line:#45392c;
  --accent:#e3a93f;--accent-ink:#f0c06a;--on-accent:#2b2118;--alert:#f0806e;--alert-soft:#3a2420;--plan:#a89880;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1913;--band:#251f18;--surface:#2a231b;--fg:#f5ebdd;--muted:#cbbba6;--line:#45392c;
  --accent:#e3a93f;--accent-ink:#f0c06a;--on-accent:#2b2118;--alert:#f0806e;--alert-soft:#3a2420;--plan:#a89880;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 위쪽 줄 */
.top{border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--font-display);font-size:1.25em;line-height:1.3}
.trial{font-size:.78em;color:var(--muted);font-weight:500}
.home-link{color:var(--fg);font-weight:700;font-size:.9em;text-decoration:none;border-bottom:2px solid var(--fg);padding-bottom:1px}
.store-warn{background:var(--alert-soft);color:var(--fg);font-size:.88em;padding-block:10px;border-bottom:1px solid var(--line)}
.store-warn b{color:var(--alert)}

/* 역할 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--band);border-radius:999px;padding:6px;margin-block:16px}
.tab{border:0;background:transparent;border-radius:999px;min-height:48px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.role-desc{margin:-4px 4px 20px;color:var(--muted);font-size:.92em;line-height:1.6}
.role-desc b{color:var(--alert)}

/* 배치 */
.layout{display:flex;flex-direction:column;gap:20px;padding-bottom:48px}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);align-items:start;gap:32px}
  .panel{position:sticky;top:16px}
  .panel[data-closed="true"]{display:flex!important}
  .open-panel{display:none!important}
  .panel .close-panel{display:none}
}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* 카드와 버튼 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:1.1em;font-weight:700}
.hint{font-size:.88em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font-weight:700;cursor:pointer}
.link{border:0;background:none;padding:6px 2px;color:var(--muted);font-size:.85em;text-decoration:underline;cursor:pointer;min-height:36px}
.btn:disabled,.btn2:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.btn2:focus-visible,.tab:focus-visible,.link:focus-visible,.home-link:focus-visible,.chip-btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.full{width:100%}
.open-panel{align-self:stretch}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.92em}
.input-wrap{position:relative}
.field input{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:10px 14px;font-size:1em}
.field input:focus{outline:none;border-color:var(--fg)}
.field input[aria-invalid="true"]{border-color:var(--alert)}
.count{font-size:.75em;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.err{font-size:.85em;color:var(--alert);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 안내 띠 */
.alarm{background:var(--accent);color:var(--on-accent);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.alarm b{font-size:1.05em}
.alarm ul{margin:0;padding-left:1.1em}
.alarm .btn2{border-color:var(--on-accent);color:var(--on-accent);min-height:40px;align-self:flex-start}
.notice-ok{background:var(--band);border-radius:14px;padding:12px 16px;font-weight:700;font-size:.92em}

/* 목록 */
.sec-title{font-size:1em;font-weight:700;color:var(--muted);margin-top:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item.is-miss{border-color:var(--alert)}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.time{font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.who{font-weight:700}
.sub{color:var(--muted);font-size:.92em}
.meta{color:var(--muted);font-size:.82em}
.ex{display:inline-block;font-size:.72em;font-weight:700;border:1.5px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.chip,.chip-btn{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:.82em;font-weight:700;border-radius:999px;padding:3px 12px;border:1.5px solid currentColor;white-space:nowrap;line-height:1.5}
.chip.plan{color:var(--plan)}
.chip.done,.chip-btn{color:var(--fg)}
.chip.miss{color:var(--alert);background:var(--alert-soft)}
.chip-btn{background:transparent;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .btn,.actions .btn2{flex:1 1 120px}
.done-line{font-size:.9em;font-weight:700}

/* 현황 요약 */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.sum b{display:block;font-size:1.8em;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:.85em;color:var(--muted);font-weight:700}
.sum.miss b{color:var(--alert)}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{font-size:1.05em}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .time{font-size:1em;min-width:72px}
.rows .del{grid-column:2 / 4;justify-self:start}
.tools{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:20px;margin-top:4px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty b{font-size:1.05em}

/* 대화상자·알림 */
.overlay{position:fixed;inset:0;background:rgba(20,14,8,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.dialog{background:var(--surface);color:var(--fg);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:18px;max-height:90vh;overflow:auto}
.dialog img{width:100%;border-radius:14px;display:block;background:var(--band)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:.92em;font-weight:500;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s,transform .2s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1>복약 확인 체험판</h1>
      <span class="trial">체험판 · 이 기기에만 저장됩니다</span>
    </div>
    <a class="home-link" href="index.html">홈페이지로</a>
  </div>
</header>
<div class="store-warn" id="storeWarn" hidden><div class="wrap"><b>이 창에서는 저장되지 않습니다.</b> 새로고침하면 입력한 내용이 사라집니다.</div></div>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="역할 선택">
    <button class="tab" type="button" role="tab" id="tab-care" data-role="care" aria-controls="view">요양보호사</button>
    <button class="tab" type="button" role="tab" id="tab-social" data-role="social" aria-controls="view">사회복지사</button>
  </div>
  <p class="role-desc" id="roleDesc" aria-live="polite"></p>

  <div class="layout">
    <!-- 약 등록 -->
    <section class="card panel" id="panel" aria-labelledby="panelTitle" data-closed="true">
      <div class="row" style="justify-content:space-between">
        <h2 id="panelTitle">약 등록</h2>
        <button class="link close-panel" type="button" id="closePanel">닫기</button>
      </div>
      <p class="hint" id="panelHint"></p>
      <div class="field">
        <label for="fElder">어르신 이름</label>
        <input id="fElder" type="text" maxlength="20" autocomplete="off" aria-describedby="eElder cElder">
        <div class="row" style="justify-content:space-between"><span class="err" id="eElder"></span><span class="count" id="cElder">0/20</span></div>
      </div>
      <div class="field">
        <label for="fDrug">약 이름</label>
        <input id="fDrug" type="text" maxlength="30" autocomplete="off" aria-describedby="eDrug cDrug">
        <div class="row" style="justify-content:space-between"><span class="err" id="eDrug"></span><span class="count" id="cDrug">0/30</span></div>
      </div>
      <div class="field">
        <label for="fTime">복용 시간</label>
        <input id="fTime" type="time" aria-describedby="eTime">
        <span class="err" id="eTime"></span>
      </div>
      <div class="field">
        <label for="fDose">1회 복용량</label>
        <input id="fDose" type="text" maxlength="20" placeholder="예: 1정, 5ml" autocomplete="off" aria-describedby="eDose cDose">
        <div class="row" style="justify-content:space-between"><span class="err" id="eDose"></span><span class="count" id="cDose">0/20</span></div>
      </div>
      <button class="btn full" type="button" id="btnRegister">등록</button>
    </section>

    <section class="col" id="view" role="tabpanel" aria-live="off"></section>
  </div>
</main>

<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="dialogRoot"></div>

<script>
(function () {
  "use strict";
  var KEY = "bokyak-app-v1";
  var LIMIT = { elder: 20, drug: 30, dose: 20, name: 10 };

  /* ---------- 저장 ---------- */
  var storageOK = true;
  try { localStorage.setItem(KEY + "-t", "1"); localStorage.removeItem(KEY + "-t"); } catch (e) { storageOK = false; }

  function blank() { return { meds: [], records: {}, role: "social", name: "", lastName: "" }; }
  var state = blank();
  if (storageOK) {
    try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(blank(), JSON.parse(raw)); }
    catch (e) { state = blank(); }
  }
  function save() {
    if (!storageOK) return true;
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  /* ---------- 시간 ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dateKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function toMin(t) { var p = String(t).split(":"); return (+p[0]) * 60 + (+p[1]); }
  function minToStr(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function fmtMin(m) { var h = Math.floor(m / 60), mm = m % 60; var ap = h < 12 ? "오전" : "오후"; var h12 = h % 12 === 0 ? 12 : h % 12; return ap + " " + h12 + ":" + pad(mm); }
  function fmtTs(ts) { var d = new Date(ts); return fmtMin(d.getHours() * 60 + d.getMinutes()); }

  /* 7일 지난 기록 정리 */
  (function prune() {
    var c = new Date(); c.setDate(c.getDate() - 7); var cut = dateKey(c), changed = false;
    Object.keys(state.records).forEach(function (k) { if (k.split("|")[1] < cut) { delete state.records[k]; changed = true; } });
    if (changed) save();
  })();

  /* ---------- 공통 ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function rec(med) { return state.records[med.id + "|" + dateKey()]; }
  function status(med) {
    var r = rec(med);
    if (r) return r.method === "photo" ? "photo" : "done";
    return nowMin() < toMin(med.time) + 30 ? "plan" : "miss";
  }
  var LABEL = { plan: "예정", done: "완료", photo: "사진 완료", miss: "미복용" };
  function byTime(a, b) { return toMin(a.time) - toMin(b.time) || a.elder.localeCompare(b.elder, "ko"); }

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* 화면 안 확인 상자 */
  var lastFocus = null;
  function closeDialog() { $("dialogRoot").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function openDialog(html, onReady) {
    lastFocus = document.activeElement;
    $("dialogRoot").innerHTML = '<div class="overlay" data-overlay="1"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">' + html + "</div></div>";
    var first = $("dialogRoot").querySelector("button"); if (first) first.focus();
    if (onReady) onReady();
  }
  function confirmBox(msg, okLabel, onOk) {
    openDialog('<p id="dlgTitle" style="font-weight:700;white-space:pre-line">' + esc(msg) + '</p><div class="row"><button class="btn2" type="button" data-dlg="cancel">취소</button><button class="btn" type="button" data-dlg="ok">' + esc(okLabel) + "</button></div>");
    $("dialogRoot").onclick = function (e) {
      var b = e.target.closest("[data-dlg]");
      if (e.target.getAttribute("data-overlay")) { closeDialog(); return; }
      if (!b) return;
      if (b.getAttribute("data-dlg") === "ok") { closeDialog(); onOk(); } else closeDialog();
    };
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("dialogRoot").innerHTML) closeDialog(); });

  /* ---------- 등록 패널 ---------- */
  var F = { elder: $("fElder"), drug: $("fDrug"), time: $("fTime"), dose: $("fDose") };
  var E = { elder: $("eElder"), drug: $("eDrug"), time: $("eTime"), dose: $("eDose") };
  var C = { elder: $("cElder"), drug: $("cDrug"), dose: $("cDose") };
  var MSG = { elder: "어르신 이름을 입력해 주세요", drug: "약 이름을 입력해 주세요", time: "복용 시간을 선택해 주세요", dose: "1회 복용량을 입력해 주세요" };
  Object.keys(C).forEach(function (k) {
    F[k].addEventListener("input", function () { C[k].textContent = F[k].value.length + "/" + LIMIT[k]; clearErr(k); });
  });
  F.time.addEventListener("input", function () { clearErr("time"); });
  F.time.addEventListener("change", function () { clearErr("time"); });
  function clearErr(k) { E[k].textContent = ""; F[k].removeAttribute("aria-invalid"); }
  ["elder", "drug", "time", "dose"].forEach(function (k) {
    F[k].addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); register(); } });
  });

  function openPanel(focus) {
    $("panel").setAttribute("data-closed", "false");
    renderPanelToggle();
    if (focus) F.elder.focus();
  }
  $("closePanel").addEventListener("click", function () { $("panel").setAttribute("data-closed", "true"); renderPanelToggle(); });
  function renderPanelToggle() {
    var closed = $("panel").getAttribute("data-closed") === "true";
    $("panel").hidden = closed && window.matchMedia("(max-width: 899px)").matches;
    var ob = document.querySelector(".open-panel"); if (ob) ob.hidden = !closed;
  }
  window.addEventListener("resize", renderPanelToggle);

  var registering = false;
  function register() {
    if (registering) return;
    if (state.role === "care" && !state.name) {
      toast("먼저 이름을 입력해 주세요");
      var n = $("fName"); if (n) { n.focus(); showNameErr(); }
      return;
    }
    var v = {}, first = null;
    ["elder", "drug", "time", "dose"].forEach(function (k) {
      v[k] = F[k].value.trim();
      if (!v[k]) { E[k].textContent = MSG[k]; F[k].setAttribute("aria-invalid", "true"); if (!first) first = k; }
      else clearErr(k);
    });
    if (first) { F[first].focus(); return; }
    registering = true; $("btnRegister").disabled = true;
    var med = { id: uid(), elder: v.elder.slice(0, LIMIT.elder), drug: v.drug.slice(0, LIMIT.drug), time: v.time, dose: v.dose.slice(0, LIMIT.dose),
      owner: state.role === "care" ? state.name : "", by: state.role === "care" ? state.name : "사회복지사", at: Date.now() };
    state.meds.push(med);
    if (!save()) { state.meds.pop(); toast("저장하지 못했습니다. 오래된 약을 지운 뒤 다시 등록해 주세요."); }
    else {
      ["elder", "drug", "time", "dose"].forEach(function (k) { F[k].value = ""; clearErr(k); });
      Object.keys(C).forEach(function (k) { C[k].textContent = "0/" + LIMIT[k]; });
      toast(state.role === "care" ? "등록했습니다 · 내 담당 약에 추가했어요" : "등록했습니다 · '담당 없음'으로 들어갔어요");
    }
    render();
    setTimeout(function () { registering = false; $("btnRegister").disabled = false; }, 500);
  }
  $("btnRegister").addEventListener("click", register);

  /* ---------- 역할 탭 ---------- */
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    state.role = b.getAttribute("data-role"); save(); render();
  });

  /* ---------- 알림(화면을 열어 둔 동안) ---------- */
  var alarmIds = [];
  var lastMin = nowMin(), lastDay = dateKey();
  function tick() {
    var day = dateKey(), m = nowMin();
    if (day !== lastDay) { lastDay = day; lastMin = -1; alarmIds = []; toast("새로운 날입니다. 오늘 기록을 시작하세요."); }
    if (m !== lastMin) {
      if (state.name) {
        state.meds.forEach(function (med) {
          var t = toMin(med.time);
          if (med.owner === state.name && t > lastMin && t <= m && !rec(med) && alarmIds.indexOf(med.id) < 0) alarmIds.push(med.id);
        });
      }
      lastMin = m; render();
    }
  }
  setInterval(tick, 15000);

  /* ---------- 사진 ---------- */
  var photoFor = null, photoBusy = null;
  $("photoInput").addEventListener("change", function () {
    var file = this.files && this.files[0]; var id = photoFor; photoFor = null;
    if (!file || !id) return;
    if (!/^image\//.test(file.type)) { toast("사진을 불러오지 못했습니다. 다시 찍거나 [체크]로 기록해 주세요."); return; }
    photoBusy = id; render();
    var url; try { url = URL.createObjectURL(file); } catch (e) { url = null; }
    function fail() { photoBusy = null; render(); toast("사진을 불러오지 못했습니다. 다시 찍거나 [체크]로 기록해 주세요."); }
    function useSrc(src) {
      var img = new Image();
      img.onload = function () {
        try {
          var max = 800, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          var data = cv.toDataURL("image/jpeg", 0.7);
          if (url) URL.revokeObjectURL(url);
          savePhoto(id, data);
        } catch (e) { fail(); }
      };
      img.onerror = function () {
        if (url && src === url) { url = null; readAsData(); } else fail();
      };
      img.src = src;
    }
    function readAsData() {
      var fr = new FileReader();
      fr.onload = function () { useSrc(fr.result); };
      fr.onerror = fail;
      fr.readAsDataURL(file);
    }
    if (url) useSrc(url); else readAsData();
  });
  function savePhoto(id, data) {
    var med = findMed(id); photoBusy = null;
    if (!med) { render(); return; }
    var k = id + "|" + dateKey();
    if (state.records[k]) { render(); toast("이미 기록했습니다"); return; }
    state.records[k] = { method: "photo", by: state.name, at: Date.now(), photo: data };
    if (!save()) { delete state.records[k]; render(); toast("사진을 더 저장할 수 없습니다. [체크]로 기록하거나 오래된 약을 지워 주세요."); return; }
    dropAlarm(id); render(); toast("사진으로 기록했습니다");
  }

  function findMed(id) { for (var i = 0; i < state.meds.length; i++) if (state.meds[i].id === id) return state.meds[i]; return null; }
  function dropAlarm(id) { alarmIds = alarmIds.filter(function (x) { return x !== id; }); }

  /* ---------- 예시 ---------- */
  function exampleImage() {
    try {
      var cv = document.createElement("canvas"); cv.width = 480; cv.height = 360; var g = cv.getContext("2d");
      g.fillStyle = "#f8edd9"; g.fillRect(0, 0, 480, 360);
      g.fillStyle = "#c79a5b"; g.fillRect(0, 250, 480, 110);
      g.fillStyle = "#ffffff"; g.fillRect(120, 150, 70, 110); g.fillRect(112, 135, 86, 26);
      g.fillStyle = "rgba(255,255,255,.75)"; g.fillRect(230, 220, 160, 40);
      g.fillStyle = "#2b2118"; g.font = "bold 34px sans-serif"; g.textAlign = "center"; g.fillText("예시 사진", 240, 80);
      return cv.toDataURL("image/jpeg", 0.7);
    } catch (e) { return ""; }
  }
  function loadExample() {
    var m = nowMin();
    if (m < 60) { toast("새벽 1시 이후에 예시를 불러와 주세요."); return; }
    if (state.meds.some(function (x) { return x.example; })) { toast("예시가 이미 들어 있습니다."); return; }
    var who = "예시 요양보호사", base = Date.now(), today = dateKey();
    var list = [
      { off: 60, method: "check" }, { off: 50, method: "photo" }, { off: 40, method: null }
    ];
    var added = [];
    list.forEach(function (x, i) {
      var t = m - x.off;
      var med = { id: uid(), elder: "예시", drug: "예시 약 " + (i + 1), time: minToStr(t), dose: "1정", owner: who, by: who, at: base, example: true };
      state.meds.push(med); added.push(med);
      if (x.method) {
        var r = { method: x.method, by: who, at: base - (x.off - 2) * 60000 };
        if (x.method === "photo") r.photo = exampleImage();
        state.records[med.id + "|" + today] = r;
      }
    });
    if (!save()) {
      added.forEach(function (med) { delete state.records[med.id + "|" + today]; });
      state.meds = state.meds.filter(function (x) { return !x.example; });
      toast("저장 공간이 부족해 예시를 넣지 못했습니다."); render(); return;
    }
    state.role = "social"; save(); render(); toast("예시를 불러왔습니다 · 완료 2 · 미복용 1");
  }

  /* ---------- 클릭 처리 ---------- */
  $("view").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), med = id ? findMed(id) : null;
    var k = id ? id + "|" + dateKey() : null;
    if (act === "name-save") return saveName();
    if (act === "name-edit") { editingName = true; render(); var n = $("fName"); if (n) { n.focus(); n.select(); } return; }
    if (act === "name-cancel") { editingName = false; render(); return; }
    if (act === "open-panel") return openPanel(true);
    if (act === "example") return loadExample();
    if (act === "alarm-close") { alarmIds = []; render(); return; }
    if (act === "reset") return confirmBox("등록한 약과 기록, 사진을 모두 지울까요? 되돌릴 수 없습니다.", "모두 지우기", function () {
      state = blank(); alarmIds = [];
      if (storageOK) { try { localStorage.removeItem(KEY); } catch (e2) {} }
      render(); toast("모두 지웠습니다");
    });
    if (!med) return;
    if (act === "check") {
      if (state.records[k]) { toast("이미 기록했습니다"); return; }
      state.records[k] = { method: "check", by: state.name, at: Date.now() };
      if (!save()) { delete state.records[k]; toast("저장하지 못했습니다. 오래된 약을 지운 뒤 다시 시도해 주세요."); render(); return; }
      dropAlarm(id); render(); toast("체크로 기록했습니다");
    } else if (act === "photo") {
      if (state.records[k]) { toast("이미 기록했습니다"); return; }
      if (photoBusy) return;
      photoFor = id; var pi = $("photoInput"); pi.value = ""; pi.click();
    } else if (act === "undo") {
      if (!state.records[k]) return;
      var old = state.records[k]; delete state.records[k];
      if (!save()) { state.records[k] = old; toast("취소하지 못했습니다. 다시 시도해 주세요."); return; }
      render(); toast("기록을 취소했습니다");
    } else if (act === "assign") {
      if (med.owner) { render(); return; }
      med.owner = state.name; save(); render(); toast("내 담당으로 지정했습니다");
    } else if (act === "view") {
      var r = state.records[k];
      if (!r || !r.photo) { toast("사진을 찾을 수 없습니다"); return; }
      openDialog('<h2 id="dlgTitle" style="font-size:1.05em">' + esc(med.elder) + " · " + esc(med.drug) + '</h2><img src="' + r.photo + '" alt="' + esc(med.elder) + ' 어르신 ' + esc(med.drug) + ' 복용 기록 사진"><p class="sub">' + esc(r.by || "") + " · " + fmtTs(r.at) + ' 사진으로 기록</p><button class="btn2" type="button" data-dlg="cancel">닫기</button>');
      $("dialogRoot").onclick = function (ev) { if (ev.target.getAttribute("data-overlay") || ev.target.closest("[data-dlg]")) closeDialog(); };
    } else if (act === "delete") {
      confirmBox(med.elder + " 어르신 · " + med.drug + "\n이 약과 기록을 지울까요?", "지우기", function () {
        state.meds = state.meds.filter(function (x) { return x.id !== id; });
        Object.keys(state.records).forEach(function (rk) { if (rk.indexOf(id + "|") === 0) delete state.records[rk]; });
        dropAlarm(id); save(); render(); toast("지웠습니다");
      });
    }
  });
  $("view").addEventListener("keydown", function (e) {
    if (e.target.id === "fName" && e.key === "Enter") { e.preventDefault(); saveName(); }
  });
  $("view").addEventListener("input", function (e) {
    if (e.target.id === "fName") { var c = $("cName"); if (c) c.textContent = e.target.value.length + "/" + LIMIT.name; var er = $("eName"); if (er) er.textContent = ""; e.target.removeAttribute("aria-invalid"); }
  });

  /* ---------- 요양보호사 이름 ---------- */
  var editingName = false;
  function showNameErr() { var er = $("eName"); if (er) er.textContent = "이름을 입력하면 내 담당 약을 볼 수 있어요"; var n = $("fName"); if (n) n.setAttribute("aria-invalid", "true"); }
  function saveName() {
    var n = $("fName"); if (!n) return;
    var v = n.value.trim().slice(0, LIMIT.name);
    if (!v) { showNameErr(); n.focus(); return; }
    state.name = v; state.lastName = v; editingName = false; alarmIds = []; save(); render(); toast(v + " 님으로 시작합니다");
  }

  /* ---------- 그리기 ---------- */
  function chip(st, med) {
    if (st === "photo") return '<button class="chip-btn" type="button" data-act="view" data-id="' + med.id + '">사진 완료</button>';
    return '<span class="chip ' + st + '">' + LABEL[st] + "</span>";
  }
  function exTag(med) { return med.example ? '<span class="ex">예시</span>' : ""; }

  function emptyBox(extra) {
    return '<div class="empty"><b>아직 등록된 약이 없습니다.</b><p class="sub">약을 등록하거나 예시를 불러와 보세요. 이 체험판은 처음 사용한 기기에만 저장됩니다.</p><div class="row">' +
      '<button class="btn" type="button" data-act="open-panel">약 등록</button>' + (extra || "") + "</div></div>";
  }

  function careView() {
    var h = "";
    if (!state.name || editingName) {
      var val = esc(state.name || state.lastName || "");
      h += '<div class="card"><h2>요양보호사 이름</h2><p class="hint">이름은 담당과 기록자를 구분하는 데만 씁니다. 로그인은 없습니다.</p>' +
        '<div class="field"><label for="fName" class="sr">이름</label><input id="fName" type="text" maxlength="10" autocomplete="off" value="' + val + '" placeholder="이름 입력">' +
        '<div class="row" style="justify-content:space-between"><span class="err" id="eName"></span><span class="count" id="cName">' + (state.name || state.lastName || "").length + "/10</span></div></div>" +
        '<div class="row"><button class="btn" type="button" data-act="name-save">' + (state.name ? "이름 바꾸기" : "시작하기") + "</button>" +
        (state.name ? '<button class="btn2" type="button" data-act="name-cancel">취소</button>' : "") + "</div></div>";
      if (!state.name) return h;
    } else {
      h += '<div class="row" style="justify-content:space-between"><p><b>' + esc(state.name) + '</b> <span class="sub">요양보호사</span></p><button class="link" type="button" data-act="name-edit">이름 바꾸기</button></div>';
    }

    var mine = state.meds.filter(function (m) { return m.owner === state.name; }).sort(byTime);
    var free = state.meds.filter(function (m) { return !m.owner; }).sort(byTime);
    var alarms = alarmIds.map(findMed).filter(function (m) { return m && !rec(m); });

    if (alarms.length) {
      h += '<div class="alarm" role="alert"><b>복용 시간입니다' + (alarms.length > 1 ? " · 약 " + alarms.length + "개" : "") + "</b><ul>" +
        alarms.map(function (m) { return "<li>" + esc(m.elder) + " 어르신 · " + esc(m.drug) + " · " + esc(m.dose) + "</li>"; }).join("") +
        '</ul><button class="btn2" type="button" data-act="alarm-close">닫기</button></div>';
    }

    h += '<button class="btn2 open-panel" type="button" data-act="open-panel">＋ 약 등록</button>';
    h += '<h2 class="sec-title">오늘 복용 목록</h2>';

    if (!state.meds.length) return h + emptyBox();
    if (!mine.length) {
      h += free.length ? '<div class="notice-ok">내 담당 약이 없습니다. 아래 약을 내 담당으로 지정할 수 있어요.</div>'
                       : '<div class="empty"><b>내 담당 약이 없습니다.</b><p class="sub">약을 등록하면 내 담당이 됩니다.</p><button class="btn" type="button" data-act="open-panel">약 등록</button></div>';
    } else {
      if (mine.every(function (m) { return rec(m); })) h += '<div class="notice-ok">오늘 담당 약을 모두 기록했습니다.</div>';
      h += '<ul class="list">' + mine.map(function (m) {
        var st = status(m), r = rec(m), busy = photoBusy === m.id;
        var act;
        if (r) act = '<p class="done-line">' + (r.method === "photo" ? "사진 완료" : "체크 완료") + " · " + fmtTs(r.at) + '</p><button class="btn2" type="button" data-act="undo" data-id="' + m.id + '">기록 취소</button>';
        else act = '<button class="btn" type="button" data-act="check" data-id="' + m.id + '"' + (busy ? " disabled" : "") + '>체크</button><button class="btn2" type="button" data-act="photo" data-id="' + m.id + '"' + (busy ? " disabled" : "") + ">" + (busy ? "사진 저장 중…" : "사진") + "</button>";
        return '<li class="item' + (st === "miss" ? " is-miss" : "") + '"><div class="item-top"><div><p class="time">' + fmtMin(toMin(m.time)) + '</p><p class="who">' + esc(m.elder) + " 어르신" + exTag(m) + '</p><p class="sub">' + esc(m.drug) + " · " + esc(m.dose) + "</p></div>" + chip(st, m) +
          '</div><div class="actions">' + act + '</div><button class="link" type="button" data-act="delete" data-id="' + m.id + '" style="align-self:flex-start">약 삭제</button></li>';
      }).join("") + "</ul>";
    }
    if (free.length) {
      h += '<h2 class="sec-title">담당 없음</h2><ul class="list">' + free.map(function (m) {
        return '<li class="item"><div class="item-top"><div><p class="time">' + fmtMin(toMin(m.time)) + '</p><p class="who">' + esc(m.elder) + " 어르신" + exTag(m) + '</p><p class="sub">' + esc(m.drug) + " · " + esc(m.dose) + "</p></div>" + chip(status(m), m) +
          '</div><div class="actions"><button class="btn2" type="button" data-act="assign" data-id="' + m.id + '">내 담당으로 지정</button></div></li>';
      }).join("") + "</ul>";
    }
    return h;
  }

  function socialView() {
    var h = '<button class="btn2 open-panel" type="button" data-act="open-panel">＋ 약 등록</button>';
    var tools = '<div class="tools"><button class="btn2" type="button" data-act="example">예시 불러오기</button><button class="link" type="button" data-act="reset">전체 초기화</button></div>';
    if (!state.meds.length) return h + '<h2 class="sec-title">전체 어르신 현황</h2>' + emptyBox('<button class="btn2" type="button" data-act="example">예시 불러오기</button>') + tools;
    var n = { done: 0, miss: 0, plan: 0 };
    state.meds.forEach(function (m) { var s = status(m); if (s === "photo" || s === "done") n.done++; else n[s]++; });
    h += '<h2 class="sec-title">전체 어르신 현황 · 오늘</h2><div class="summary" aria-label="오늘 현황 요약">' +
      '<div class="sum"><b>' + n.done + '</b><span>완료</span></div><div class="sum miss"><b>' + n.miss + '</b><span>미복용</span></div><div class="sum"><b>' + n.plan + "</b><span>예정</span></div></div>";
    var groups = {};
    state.meds.forEach(function (m) { (groups[m.elder] = groups[m.elder] || []).push(m); });
    Object.keys(groups).sort(function (a, b) { return a.localeCompare(b, "ko"); }).forEach(function (name) {
      var list = groups[name].sort(byTime);
      h += '<div class="group"><h3>' + esc(name) + " 어르신" + (list.some(function (m) { return m.example; }) ? '<span class="ex">예시</span>' : "") + '</h3><ul class="rows">' + list.map(function (m) {
        var st = status(m), r = rec(m);
        var meta = "담당 " + (m.owner ? esc(m.owner) : "없음") + (r ? " · " + esc(r.by || "") + " " + fmtTs(r.at) + " 기록" : "");
        return '<li><p class="time">' + fmtMin(toMin(m.time)) + '</p><div><p><b>' + esc(m.drug) + "</b> · " + esc(m.dose) + '</p><p class="meta">' + meta + "</p></div>" + chip(st, m) +
          '<button class="link del" type="button" data-act="delete" data-id="' + m.id + '">약 삭제</button></li>';
      }).join("") + "</ul></div>";
    });
    return h + tools;
  }

  function render() {
    $("storeWarn").hidden = storageOK;
    document.querySelectorAll(".tab").forEach(function (t) {
      var on = t.getAttribute("data-role") === state.role;
      t.setAttribute("aria-selected", on ? "true" : "false"); t.tabIndex = on ? 0 : -1;
    });
    $("roleDesc").innerHTML = state.role === "care"
      ? "담당 어르신의 약을 체크하거나 사진으로 기록합니다."
      : "전체 어르신의 복약 상태를 확인합니다. 복용 시간 30분이 지나도 기록이 없으면 <b>미복용</b>으로 바뀝니다.";
    $("view").setAttribute("aria-labelledby", state.role === "care" ? "tab-care" : "tab-social");
    $("panelHint").textContent = state.role === "care"
      ? (state.name ? "등록하면 내 담당 약이 됩니다." : "먼저 이름을 입력하면 약을 등록할 수 있습니다.")
      : "사회복지사가 등록한 약은 '담당 없음'으로 들어갑니다.";
    var focusId = document.activeElement && document.activeElement.id === "fName" ? "fName" : null;
    var nameVal = focusId ? $("fName").value : null;
    $("view").innerHTML = state.role === "care" ? careView() : socialView();
    if (focusId && $("fName")) { $("fName").value = nameVal; $("fName").focus(); }
    renderPanelToggle();
  }

  render();
})();
</script>
</body>
</html>
